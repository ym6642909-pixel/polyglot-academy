(function(){
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
e.preventDefault();deferredPrompt=e;
if(document.getElementById("pgInstallBtn"))return;
var b=document.createElement("button");
b.id="pgInstallBtn";
b.textContent="⬇ ثبّت التطبيق";
b.style.cssText="position:fixed;bottom:18px;left:18px;z-index:99999;background:#e5a13b;color:#10172b;border:0;border-radius:14px;padding:11px 18px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);direction:rtl";
b.onclick=function(){b.remove();if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}};
document.body.appendChild(b);
setTimeout(function(){if(b.parentNode)b.remove()},45000);
});
window.addEventListener("appinstalled",function(){var b=document.getElementById("pgInstallBtn");if(b)b.remove()});
})();
</script>
